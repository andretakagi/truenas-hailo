name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/hailo-preinit.sh'
      - '.github/scripts/check-preinit-sync.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/hailo-preinit.sh'
      - '.github/scripts/check-preinit-sync.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preinit-sync:
    name: PREINIT heredoc matches standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-preinit-sync.sh
