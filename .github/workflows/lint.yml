name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.sh'
      - '.github/scripts/**.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'scripts/**.sh'
      - '.github/scripts/**.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preinit-sync:
    name: PREINIT heredoc matches standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-preinit-sync.sh

  shellcheck:
    name: shellcheck shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck --severity=warning \
            scripts/install.sh \
            scripts/hailo-preinit.sh \
            scripts/restore.sh \
            .github/scripts/*.sh
