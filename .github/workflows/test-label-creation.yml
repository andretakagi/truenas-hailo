name: "Test: hardware-test label creation"

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-label:
    runs-on: ubuntu-latest
    steps:
      - name: Create label and test issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'hardware-test';

            // --- Step 1: delete the label if it exists so we start clean ---
            try {
              await github.rest.issues.deleteLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
              console.log(`Deleted existing "${label}" label to start clean`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`"${label}" label does not exist yet, good`);
              } else {
                throw e;
              }
            }

            // --- Step 2: run the exact code from build.yml ---
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'hardware-test',
                color: 'FBCA04',
                description: 'Auto-build awaiting hardware verification',
              });
              console.log('Created hardware-test label');
            } catch (e) {
              if (e.status === 422) {
                console.log('hardware-test label already exists');
              } else {
                throw e;
              }
            }

            // --- Step 3: verify the label was created with correct attributes ---
            const { data: created } = await github.rest.issues.getLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: label,
            });
            console.log(`Label check: name="${created.name}" color="${created.color}" desc="${created.description}"`);

            const colorOk = created.color === 'FBCA04';
            const descOk = created.description === 'Auto-build awaiting hardware verification';
            if (!colorOk || !descOk) {
              throw new Error(`Label attributes wrong: color=${created.color}, desc=${created.description}`);
            }
            console.log('Label attributes verified');

            // --- Step 4: run it again to test the idempotent (422) path ---
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'hardware-test',
                color: 'FBCA04',
                description: 'Auto-build awaiting hardware verification',
              });
              console.log('Created hardware-test label (unexpected, should have been 422)');
            } catch (e) {
              if (e.status === 422) {
                console.log('Idempotent path works: 422 caught as expected');
              } else {
                throw e;
              }
            }

            // --- Step 5: create a test issue to confirm the full flow ---
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[TEST] Label creation smoke test (safe to delete)',
              labels: ['hardware-test'],
              body: 'Automated test from test-label-creation.yml. Safe to close and delete.',
            });
            console.log(`Created test issue #${issue.number}`);

            // --- Step 6: close and clean up ---
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
            });
            console.log(`Closed test issue #${issue.number}`);

            console.log('All checks passed');
