name: Check for New TrueNAS Releases

on:
  schedule:
    - cron: '15 6 * * *'  # Daily at 06:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new TrueNAS releases
        id: check_release
        run: |
          # Pick the latest stable scale-build tag (regardless of train) and
          # resolve its train name live from the download.truenas.com
          # directory listing. This lets the train change roll over
          # automatically when iXsystems ships a new train (e.g. Goldeye →
          # next), without anyone hardcoding a major.minor filter or the
          # train name.
          #
          # Failure modes that should fail the workflow loudly (::error::):
          #   - scale-build tags API unreachable
          #   - download.truenas.com listing unreachable or unparseable
          #   - one tagged version appears under multiple trains (impossible
          #     under iXsystems' conventions; if it happens, fail rather
          #     than guess)
          #
          # Soft cases that exit success without bumping (no notification):
          #   - no new tag
          #   - tag exists but listing/ISO not yet published (just retry
          #     tomorrow; same shape as the existing ISO gate)
          set -o pipefail

          if ! TAGS_JSON=$(curl -fsSL "https://api.github.com/repos/truenas/scale-build/tags?per_page=100" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"); then
            echo "::error title=TrueNAS check::failed to fetch scale-build tags"
            exit 1
          fi

          LATEST_TAG=$(printf '%s' "$TAGS_JSON" | python3 -c "
          import sys, json
          tags = json.load(sys.stdin)
          stable = [
              t['name'] for t in tags
              if t['name'].startswith('TS-')
              and 'BETA' not in t['name'].upper()
              and 'RC' not in t['name'].upper()
          ]
          if not stable:
              sys.exit(0)
          stable.sort(key=lambda x: [int(p) for p in x.replace('TS-','').split('.')])
          print(stable[-1])
          ")

          if [ -z "$LATEST_TAG" ]; then
            echo "::error title=TrueNAS check::no stable tags found in scale-build (parser likely broken)"
            exit 1
          fi

          LATEST_VERSION="${LATEST_TAG#TS-}"
          CURRENT_VERSION=$(cat version | tr -d '[:space:]')
          CURRENT_TRAIN=$(cat train | tr -d '[:space:]')

          echo "Latest scale-build tag: ${LATEST_TAG} (version: ${LATEST_VERSION})"
          echo "Currently tracked: ${CURRENT_VERSION} on train ${CURRENT_TRAIN}"

          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "No new release"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defense against tag deletions / numeric regressions: only accept
          # if the candidate is strictly higher than what we track.
          HIGHER=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | python3 -c "
          import sys
          versions = [line.strip() for line in sys.stdin if line.strip()]
          versions.sort(key=lambda v: [int(p) for p in v.split('.')])
          print(versions[-1])
          ")
          if [ "$HIGHER" != "$LATEST_VERSION" ]; then
            echo "Latest tag ${LATEST_VERSION} is not higher than tracked ${CURRENT_VERSION} — ignoring"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve train name from download.truenas.com listing. The site
          # serves an HTML directory index; we regex out every
          # `TrueNAS-SCALE-<Train>/<version>/` reference and find which
          # train contains LATEST_VERSION.
          if ! LISTING=$(curl -fsSL "https://download.truenas.com/"); then
            echo "::error title=TrueNAS check::failed to fetch download.truenas.com listing"
            exit 1
          fi

          # Sanity check: the listing must contain a credible number of
          # train references. If it returns ~empty or garbled HTML our
          # train resolution would silently produce nothing — fail loud.
          TRAIN_COUNT=$(printf '%s' "$LISTING" | python3 -c "
          import sys, re
          trains = sorted(set(re.findall(r'TrueNAS-SCALE-([A-Z][a-zA-Z]+)/', sys.stdin.read())))
          print(len(trains))
          ")
          if [ "$TRAIN_COUNT" -lt 3 ]; then
            echo "::error title=TrueNAS check::download.truenas.com listing has only ${TRAIN_COUNT} train references — looks broken or rate-limited"
            exit 1
          fi

          MATCHED_TRAINS=$(printf '%s' "$LISTING" | LATEST_VERSION="$LATEST_VERSION" python3 -c "
          import sys, os, re
          version = os.environ['LATEST_VERSION']
          listing = sys.stdin.read()
          pattern = re.compile(r'TrueNAS-SCALE-([A-Z][a-zA-Z]+)/' + re.escape(version) + r'/')
          for t in sorted(set(pattern.findall(listing))):
              print(t)
          ")

          NUM_MATCHES=$(printf '%s' "$MATCHED_TRAINS" | python3 -c "
          import sys
          print(sum(1 for line in sys.stdin if line.strip()))
          ")

          if [ "$NUM_MATCHES" -eq 0 ]; then
            echo "Tag ${LATEST_VERSION} found in scale-build, but not yet listed on download.truenas.com under any train. Will retry on next scheduled run."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$NUM_MATCHES" -gt 1 ]; then
            echo "::error title=TrueNAS check::version ${LATEST_VERSION} appears under multiple trains — refusing to guess"
            echo "Matched trains:" >&2
            printf '  %s\n' $MATCHED_TRAINS >&2
            exit 1
          fi

          NEW_TRAIN=$(printf '%s' "$MATCHED_TRAINS" | python3 -c "
          import sys
          for line in sys.stdin:
              s = line.strip()
              if s:
                  print(s)
                  break
          ")
          echo "Resolved train for ${LATEST_VERSION}: ${NEW_TRAIN}"

          # ISO-file gate: the directory exists, but the ISO inside may
          # still be uploading. HEAD-check the actual file URL.
          ISO_URL="https://download.truenas.com/TrueNAS-SCALE-${NEW_TRAIN}/${LATEST_VERSION}/TrueNAS-SCALE-${LATEST_VERSION}.iso"
          if ! curl -fsI "$ISO_URL" >/dev/null 2>&1; then
            echo "ISO not yet published at ${ISO_URL}. Will retry on next scheduled run."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Surface a notice (non-failing) when the train rolls over so the
          # user sees it in the run summary, but don't treat it as an
          # error — auto-rollover is the intended behavior.
          if [ "$NEW_TRAIN" != "$CURRENT_TRAIN" ]; then
            echo "::notice title=TrueNAS train rollover::train moved from ${CURRENT_TRAIN} to ${NEW_TRAIN} (version ${LATEST_VERSION})"
          fi

          echo "New release detected, train resolved, ISO is published."
          echo "new_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_train=${NEW_TRAIN}" >> "$GITHUB_OUTPUT"

      - name: Read Hailo driver version
        if: steps.check_release.outputs.new_release == 'true'
        id: hailo
        run: |
          echo "hailo_version=$(cat .hailo-driver-version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Update tracked version and train
        if: steps.check_release.outputs.new_release == 'true'
        run: |
          echo -n "${{ steps.check_release.outputs.new_version }}" > version
          echo -n "${{ steps.check_release.outputs.new_train }}" > train
          # Keep build.yml's manual-dispatch defaults aligned with the
          # tracked combo so the next human-run build pre-fills the
          # latest values. Fails loudly if the YAML structure shifts.
          python3 .github/scripts/sync-build-defaults.py \
            "truenas_version=${{ steps.check_release.outputs.new_version }}" \
            "train_name=${{ steps.check_release.outputs.new_train }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version train .github/workflows/build.yml
          # Compose a message that reflects whether train changed, so the
          # auto-bump log is self-explanatory in `git log`.
          if git diff --cached --name-only | grep -q '^train$'; then
            MSG="Update tracked TrueNAS version to ${{ steps.check_release.outputs.new_version }} (train: ${{ steps.check_release.outputs.new_train }})"
          else
            MSG="Update tracked TrueNAS version to ${{ steps.check_release.outputs.new_version }}"
          fi
          git commit -m "$MSG" || {
            echo "ERROR: Failed to commit version update"
            exit 1
          }
          git push || {
            echo "ERROR: Failed to push version update"
            exit 1
          }

      - name: Trigger build for new TrueNAS release
        if: steps.check_release.outputs.new_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                truenas_version: '${{ steps.check_release.outputs.new_version }}',
                hailo_driver_version: '${{ steps.hailo.outputs.hailo_version }}',
                train_name: '${{ steps.check_release.outputs.new_train }}',
                mark_latest: 'false'
              }
            });
            console.log('Triggered build for TrueNAS ${{ steps.check_release.outputs.new_version }} on ${{ steps.check_release.outputs.new_train }}');
