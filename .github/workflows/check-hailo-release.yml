name: Check for New Hailo Releases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for newer HailoRT release
        id: check_driver
        run: |
          KNOWN_VERSION=$(cat .hailo-driver-version | tr -d '[:space:]')
          echo "Current tracked version: ${KNOWN_VERSION}"

          # Hailo-8 support lives on hailort-drivers' `hailo8` branch (4.x line).
          # `master` tracks 5.x for Hailo-10/15 and does not support Hailo-8.
          # The GitHub /tags API enumerates tags repo-wide and cannot tell us
          # which branch a tag is reachable from, so we shallow-clone the
          # `hailo8` branch and ask git directly.
          git clone --quiet --filter=blob:none --no-checkout --branch hailo8 \
            https://github.com/hailo-ai/hailort-drivers.git "${RUNNER_TEMP}/hailort-drivers"

          LATEST=$(git -C "${RUNNER_TEMP}/hailort-drivers" tag --merged origin/hailo8 \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)

          echo "Latest available version: ${LATEST}"

          if [ -n "$LATEST" ] && [ "$LATEST" != "$KNOWN_VERSION" ]; then
            HIGHER=$(printf '%s\n%s\n' "$KNOWN_VERSION" "$LATEST" | sort -V | tail -n1)
            if [ "$HIGHER" = "$LATEST" ]; then
              echo "Newer version found: ${LATEST}"
              echo "new_driver=true" >> "$GITHUB_OUTPUT"
              echo "new_version=${LATEST}" >> "$GITHUB_OUTPUT"
            else
              echo "No newer version"
              echo "new_driver=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No newer version"
            echo "new_driver=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if issue already exists
        if: steps.check_driver.outputs.new_driver == 'true'
        id: existing_issue
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.check_driver.outputs.new_version }}';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'hailo-driver-update',
              per_page: 100
            });
            const exists = issues.data.some(i => i.title.includes(newVersion));
            core.setOutput('exists', exists.toString());

      - name: Create issue for new Hailo driver
        if: steps.check_driver.outputs.new_driver == 'true' && steps.existing_issue.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.check_driver.outputs.new_version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New HailoRT driver available: ${newVersion}`,
              body: `A newer HailoRT driver has been detected: **${newVersion}**\n\n` +
                `Source: https://github.com/hailo-ai/hailort-drivers/releases/tag/v${newVersion}\n\n` +
                `This tag has been verified to be reachable from the \`hailo8\` branch ` +
                `(the 4.x line that supports Hailo-8).\n\n` +
                `To build with this driver, manually trigger the **Build Hailo Sysext** workflow with:\n` +
                `- \`hailo_driver_version\`: \`${newVersion}\`\n\n` +
                `After verifying the build on real Hailo-8 hardware, update \`.hailo-driver-version\` to track this as the new default.`,
              labels: ['hailo-driver-update']
            });
