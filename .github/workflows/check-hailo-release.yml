name: Check for New Hailo Releases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for newer HailoRT release
        id: check_driver
        run: |
          KNOWN_VERSION=$(cat .hailo-driver-version | tr -d '[:space:]')
          echo "Current tracked version: ${KNOWN_VERSION}"

          # Hailo-8 support lives on hailort-drivers' `hailo8` branch (4.x line).
          # `master` tracks 5.x for Hailo-10/15 and does not support Hailo-8.
          # The GitHub /tags API enumerates tags repo-wide and cannot tell us
          # which branch a tag is reachable from, so we shallow-clone the
          # `hailo8` branch and ask git directly.
          git clone --quiet --filter=blob:none --no-checkout --branch hailo8 \
            https://github.com/hailo-ai/hailort-drivers.git "${RUNNER_TEMP}/hailort-drivers"

          LATEST=$(git -C "${RUNNER_TEMP}/hailort-drivers" tag --merged origin/hailo8 \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)

          echo "Latest available version: ${LATEST}"

          # Frigate enforces exact-match between the host kernel module and its
          # bundled libhailort (HailoRT returns HAILO_INVALID_DRIVER_VERSION(76)
          # otherwise). The tracked driver must not move ahead of the version
          # pinned in Frigate's install scripts on the dev branch — doing so
          # bricks every currently-shipping Frigate the moment a user reboots
          # into the new sysext.
          #
          # Parse defensively. Soft failures here are dangerous: if we silently
          # pick the wrong version, the next bump can ship a sysext that breaks
          # users. Requirements:
          #   - curl failure must fail the step (set -o pipefail).
          #   - The grep must find exactly one matching line; no match = fail.
          #   - The extracted value must match X.Y.Z exactly; pre-release
          #     suffixes (e.g. 4.22.0-rc1) are rejected since HailoRT's
          #     handshake would not consider them equal to a release tag.
          #   - Cross-check a second source (Frigate's hailo8l install script
          #     pins the same value) and require both agree. A divergence is
          #     a Frigate bug we want surfaced, not papered over.
          set -o pipefail

          # All error paths below emit a `::error::` workflow command in
          # addition to stderr context. Annotations surface at the top of
          # the run summary and in the failure-notification email subject,
          # so a silently-broken pin parser shows up loudly instead of
          # being buried in step logs.
          parse_frigate_pin() {
            local url="$1"
            local label="$2"
            local content line value
            if ! content=$(curl -fsSL "$url"); then
              echo "::error title=Frigate pin parser::curl failed fetching ${label} (${url})"
              echo "ERROR: curl failed fetching ${label}: ${url}" >&2
              return 1
            fi
            # Match `hailo_version="X.Y.Z"` or `hailo_version=X.Y.Z` with
            # optional surrounding whitespace and optional double or single
            # quotes. Anchored to start-of-line modulo whitespace; ignores
            # trailing comments. Comment lines (`# hailo_version=...`) are
            # excluded because `#` is not whitespace.
            line=$(printf '%s\n' "$content" \
              | grep -E '^[[:space:]]*hailo_version[[:space:]]*=' \
              || true)
            if [ -z "$line" ]; then
              echo "::error title=Frigate pin parser::${label} contains no hailo_version assignment"
              echo "ERROR: ${label} contains no hailo_version assignment" >&2
              return 1
            fi
            local count
            count=$(printf '%s\n' "$line" | wc -l | tr -d ' ')
            if [ "$count" -ne 1 ]; then
              echo "::error title=Frigate pin parser::${label} has ${count} active hailo_version assignments (expected 1)"
              echo "ERROR: ${label} has ${count} hailo_version assignments (expected 1):" >&2
              printf '%s\n' "$line" >&2
              return 1
            fi
            value=$(printf '%s\n' "$line" \
              | sed -E 's/^[[:space:]]*hailo_version[[:space:]]*=[[:space:]]*["'"'"']?([^"'"'"' #]+)["'"'"']?.*$/\1/')
            if ! printf '%s' "$value" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error title=Frigate pin parser::${label} hailo_version is not a clean X.Y.Z release: '${value}'"
              echo "ERROR: ${label} hailo_version is not a clean X.Y.Z release: '${value}'" >&2
              echo "  raw line: ${line}" >&2
              return 1
            fi
            echo "${label}: ${line} -> ${value}" >&2
            printf '%s' "$value"
          }

          # Capture each pin via explicit `if !` so failure propagates
          # unambiguously regardless of bash's inherit_errexit setting in
          # command substitutions. Belt and suspenders alongside `set -e`.
          if ! FRIGATE_MAIN_PIN=$(parse_frigate_pin \
              "https://raw.githubusercontent.com/blakeblackshear/frigate/dev/docker/main/install_hailort.sh" \
              "frigate dev docker/main/install_hailort.sh"); then
            echo "::error title=Frigate pin parser::failed to parse docker/main/install_hailort.sh — refusing to bump"
            exit 1
          fi
          if ! FRIGATE_HAILO8L_PIN=$(parse_frigate_pin \
              "https://raw.githubusercontent.com/blakeblackshear/frigate/dev/docker/hailo8l/user_installation.sh" \
              "frigate dev docker/hailo8l/user_installation.sh"); then
            echo "::error title=Frigate pin parser::failed to parse docker/hailo8l/user_installation.sh — refusing to bump"
            exit 1
          fi

          if [ "$FRIGATE_MAIN_PIN" != "$FRIGATE_HAILO8L_PIN" ]; then
            echo "::error title=Frigate pins disagree::install_hailort.sh=${FRIGATE_MAIN_PIN}, user_installation.sh=${FRIGATE_HAILO8L_PIN} — refusing to guess which is canonical"
            echo "ERROR: Frigate's two HailoRT pins disagree:" >&2
            echo "  docker/main/install_hailort.sh         = ${FRIGATE_MAIN_PIN}" >&2
            echo "  docker/hailo8l/user_installation.sh    = ${FRIGATE_HAILO8L_PIN}" >&2
            echo "Refusing to guess which one is canonical." >&2
            exit 1
          fi
          FRIGATE_PIN="$FRIGATE_MAIN_PIN"
          echo "Frigate pinned version: ${FRIGATE_PIN}"

          # Cap the candidate at the Frigate pin so we never bump past what
          # Frigate's userspace can talk to.
          CANDIDATE=$(printf '%s\n%s\n' "$LATEST" "$FRIGATE_PIN" | sort -V | head -n1)
          echo "Capped candidate version: ${CANDIDATE}"

          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$KNOWN_VERSION" ]; then
            HIGHER=$(printf '%s\n%s\n' "$KNOWN_VERSION" "$CANDIDATE" | sort -V | tail -n1)
            if [ "$HIGHER" = "$CANDIDATE" ]; then
              echo "Newer version found: ${CANDIDATE} (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
              echo "new_driver=true" >> "$GITHUB_OUTPUT"
              echo "new_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"
            else
              echo "No newer version (tracked is ahead of Frigate pin — wait for Frigate to move)"
              echo "new_driver=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No newer version (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
            echo "new_driver=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read TrueNAS version
        if: steps.check_driver.outputs.new_driver == 'true'
        id: truenas
        run: |
          echo "truenas_version=$(cat version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Read train name
        if: steps.check_driver.outputs.new_driver == 'true'
        id: train
        run: |
          echo "train=$(cat train | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Update tracked driver version
        if: steps.check_driver.outputs.new_driver == 'true'
        run: |
          echo -n "${{ steps.check_driver.outputs.new_version }}" > .hailo-driver-version
          # Keep build.yml's manual-dispatch default aligned with the
          # tracked driver so the next human-run build pre-fills the
          # latest value. Fails loudly if the YAML structure shifts.
          python3 .github/scripts/sync-build-defaults.py \
            "hailo_driver_version=${{ steps.check_driver.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hailo-driver-version .github/workflows/build.yml
          git commit -m "Update tracked HailoRT driver version to ${{ steps.check_driver.outputs.new_version }}" || {
            echo "ERROR: Failed to commit driver version update"
            exit 1
          }
          git push || {
            echo "ERROR: Failed to push driver version update"
            exit 1
          }

      - name: Trigger build for new HailoRT driver
        if: steps.check_driver.outputs.new_driver == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                truenas_version: '${{ steps.truenas.outputs.truenas_version }}',
                hailo_driver_version: '${{ steps.check_driver.outputs.new_version }}',
                train_name: '${{ steps.train.outputs.train }}',
                mark_latest: 'false'
              }
            });
            console.log('Triggered build for HailoRT ${{ steps.check_driver.outputs.new_version }}');
