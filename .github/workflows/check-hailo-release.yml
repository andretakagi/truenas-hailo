name: Check for New Hailo Releases

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for newer HailoRT release
        id: check_driver
        run: |
          KNOWN_VERSION=$(cat .hailo-driver-version | tr -d '[:space:]')
          echo "Current tracked version: ${KNOWN_VERSION}"

          # Hailo-8 support lives on hailort-drivers' `hailo8` branch (4.x line).
          # `master` tracks 5.x for Hailo-10/15 and does not support Hailo-8.
          # The GitHub /tags API enumerates tags repo-wide and cannot tell us
          # which branch a tag is reachable from, so we shallow-clone the
          # `hailo8` branch and ask git directly.
          git clone --quiet --filter=blob:none --no-checkout --branch hailo8 \
            https://github.com/hailo-ai/hailort-drivers.git "${RUNNER_TEMP}/hailort-drivers"

          LATEST=$(git -C "${RUNNER_TEMP}/hailort-drivers" tag --merged origin/hailo8 \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n1)

          echo "Latest available version: ${LATEST}"

          # Frigate enforces exact-match between the host kernel module and its
          # bundled libhailort (HailoRT returns HAILO_INVALID_DRIVER_VERSION(76)
          # otherwise). The tracked driver must not move ahead of the version
          # pinned in Frigate's docker/main/install_hailort.sh on the dev
          # branch — doing so bricks every currently-shipping Frigate the
          # moment a user reboots into the new sysext.
          FRIGATE_PIN=$(curl -fsSL \
            https://raw.githubusercontent.com/blakeblackshear/frigate/dev/docker/main/install_hailort.sh \
            | grep -E '^hailo_version=' \
            | head -n1 \
            | sed -E 's/^hailo_version="?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/')

          if [ -z "$FRIGATE_PIN" ]; then
            echo "ERROR: Could not parse hailo_version from Frigate's install_hailort.sh"
            exit 1
          fi
          echo "Frigate pinned version: ${FRIGATE_PIN}"

          # Cap the candidate at the Frigate pin so we never bump past what
          # Frigate's userspace can talk to.
          CANDIDATE=$(printf '%s\n%s\n' "$LATEST" "$FRIGATE_PIN" | sort -V | head -n1)
          echo "Capped candidate version: ${CANDIDATE}"

          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$KNOWN_VERSION" ]; then
            HIGHER=$(printf '%s\n%s\n' "$KNOWN_VERSION" "$CANDIDATE" | sort -V | tail -n1)
            if [ "$HIGHER" = "$CANDIDATE" ]; then
              echo "Newer version found: ${CANDIDATE} (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
              echo "new_driver=true" >> "$GITHUB_OUTPUT"
              echo "new_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"
            else
              echo "No newer version (tracked is ahead of Frigate pin — wait for Frigate to move)"
              echo "new_driver=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No newer version (Hailo latest: ${LATEST}, Frigate pin: ${FRIGATE_PIN})"
            echo "new_driver=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read TrueNAS version
        if: steps.check_driver.outputs.new_driver == 'true'
        id: truenas
        run: |
          echo "truenas_version=$(cat version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Read train name
        if: steps.check_driver.outputs.new_driver == 'true'
        id: train
        run: |
          echo "train=$(cat train | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Update tracked driver version
        if: steps.check_driver.outputs.new_driver == 'true'
        run: |
          echo -n "${{ steps.check_driver.outputs.new_version }}" > .hailo-driver-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hailo-driver-version
          git commit -m "Update tracked HailoRT driver version to ${{ steps.check_driver.outputs.new_version }}" || {
            echo "ERROR: Failed to commit driver version update"
            exit 1
          }
          git push || {
            echo "ERROR: Failed to push driver version update"
            exit 1
          }

      - name: Trigger build for new HailoRT driver
        if: steps.check_driver.outputs.new_driver == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                truenas_version: '${{ steps.truenas.outputs.truenas_version }}',
                hailo_driver_version: '${{ steps.check_driver.outputs.new_version }}',
                train_name: '${{ steps.train.outputs.train }}',
                mark_latest: 'false'
              }
            });
            console.log('Triggered build for HailoRT ${{ steps.check_driver.outputs.new_version }}');
